spring.application.name=netops-copilot

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/netops_copilot
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable automatic SQL initialization for now
spring.sql.init.mode=never

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=netops-copilot-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.telecom.netops.events
spring.kafka.consumer.properties[spring.json.value.default.type]=com.telecom.netops.events.TelecomKpiEvent
spring.kafka.listener.ack-mode=record

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
