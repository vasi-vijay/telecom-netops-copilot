spring.application.name=netops-copilot

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/netops_copilot
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable automatic SQL initialization for now
spring.sql.init.mode=never

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=netops-copilot-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.telecom.netops.events
spring.kafka.consumer.properties[spring.json.value.default.type]=com.telecom.netops.events.TelecomKpiEvent

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JsonDeserializer
# Kafka consumer retry and recovery
spring.kafka.listener.ack-mode=record

# Retry failed records with exponential backoff
spring.kafka.listener.concurrency=3

# Producer settings for dead-letter publishing
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
